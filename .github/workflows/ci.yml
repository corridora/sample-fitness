name: Validate fitness sample
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_HOME: ${{ github.workspace }}/.local/dotnet
      NUGET_PACKAGES: ${{ github.workspace }}/.local/nuget
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DEMO_CONTROL_TOKEN: local-ci-control
      CORRIDORA_OTLP_ENDPOINT: http://127.0.0.1:4318
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./setup --help
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: dotnet restore tests/Fitness.Tests/Fitness.Tests.csproj --locked-mode
      - run: dotnet run --project tests/Fitness.Tests/Fitness.Tests.csproj --no-restore
      - run: dotnet build src/Fitness.Api/Fitness.Api.csproj -p:RestoreLockedMode=true
      - run: dotnet build src/Fitness.Worker/Fitness.Worker.csproj -p:RestoreLockedMode=true
      - run: npm ci --ignore-scripts && npm run build && npx playwright install --with-deps chromium
        working-directory: web
      - run: python3 tests/integration.py
      - run: az bicep build --file infra/main.bicep --outfile .local/main.json
